<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جامعہ عائشہ صدیقہ للبنات - مینجمنٹ سسٹم</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; color: #333; }
        .navbar { background-color: #4a154b; }
        .card-header { background-color: #611f69; color: white; font-weight: bold; }
        .btn-custom { background-color: #4a154b; color: white; }
        .btn-custom:hover { background-color: #611f69; color: white; }
        .nav-tabs .nav-link.active { background-color: #611f69; color: white; }
        .nav-tabs .nav-link { color: #611f69; font-weight: 500; }
    </style>
</head>
<body>

    <!-- ہیڈر -->
    <nav class="navbar navbar-dark shadow-sm mb-4">
        <div class="container text-center">
            <span class="navbar-brand mx-auto h1 mb-0 fs-3">جامعہ عائشہ صدیقہ للبنات</span>
        </div>
    </nav>

    <div class="container">
        <!-- بیک اپ بٹن -->
        <div class="text-start mb-3">
            <a href="/api/backup" class="btn btn-warning fw-bold">📥 ڈیٹا بیک اپ (ZIP ڈاؤن لوڈ کریں)</a>
        </div>

        <!-- نیویگیشن ٹیبز -->
        <ul class="nav nav-tabs id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="admission-tab" data-bs-toggle="tab" data-bs-target="#admission" type="button" role="tab">📝 نیا داخلہ</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="students-tab" data-bs-toggle="tab" data-bs-target="#students" type="button" role="tab" onclick="loadStudents()">👩‍🎓 طالبات کی لسٹ</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="fees-tab" data-bs-toggle="tab" data-bs-target="#fees" type="button" role="tab" onclick="loadFeesPage()">💰 فیس مینجمنٹ</button>
            </li>
        </ul>

        <div class="tab-content bg-white p-4 border border-top-0 rounded-bottom shadow-sm mb-5" id="myTabContent">
            
            <!-- 1. داخلہ فارم -->
            <div class="tab-pane fade show active" id="admission" role="tabpanel">
                <h3 class="mb-4 text-center text-purple">طالبہ کا داخلہ فارم</h3>
                <form id="admissionForm" onsubmit="submitAdmission(event)">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">طالبہ کا مکمل نام</label>
                            <input type="text" id="fullName" class="form-line form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">والد کا نام</label>
                            <input type="text" id="fatherName" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">تاریخِ پیدائش</label>
                            <input type="date" id="dob" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">بی فارم / شناختی کارڈ نمبر</label>
                            <input type="text" id="bForm" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">داخلہ کلاس</label>
                            <input type="text" id="admissionClass" class="form-control" placeholder="مثلاً اول، دوم" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">سرپرست کا موبائل نمبر</label>
                            <input type="tel" id="guardianPhone" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">مکمل پتہ</label>
                            <input type="text" id="address" class="form-control" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-custom w-100 mt-4">حفظ داخلہ ریکارڈ</button>
                </form>
            </div>

            <!-- 2. طالبات کی لسٹ -->
            <div class="tab-pane fade" id="students" role="tabpanel">
                <h3 class="mb-4 text-center">موجودہ طالبات کا ریکارڈ</h3>
                <div class="table-responsive">
                    <table class="table table-bordered table-striped text-center">
                        <thead class="table-dark">
                            <tr>
                                <th>نام</th>
                                <th>والد کا نام</th>
                                <th>کلاس</th>
                                <th>بی فارم</th>
                                <th>موبائل</th>
                                <th>داخلہ تاریخ</th>
                                <th>ایکشن</th>
                            </tr>
                        </thead>
                        <tbody id="studentsTableBody">
                            <!-- ڈیٹا یہاں لوڈ ہوگا -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 3. فیس سیکشن -->
            <div class="tab-pane fade" id="fees" role="tabpanel">
                <h3 class="mb-4 text-center">فیس کی ادائیگی</h3>
                <form id="feeForm" onsubmit="submitFee(event)" class="mb-5 p-3 border rounded bg-light">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label">طالبہ سلیکٹ کریں</label>
                            <select id="feeStudentSelect" class="form-select" required><option value="">انتخاب کریں...</option></select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">رقم (روپے)</label>
                            <input type="number" id="feeAmount" class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">مہینہ</label>
                            <input type="text" id="feeMonth" class="form-control" placeholder="مثلاً جنوری" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">سال</label>
                            <input type="number" id="feeYear" class="form-control" value="2026" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success w-100 mt-3">فیس جمع کریں</button>
                </form>

                <h4 class="mb-3">فیس کی ہسٹری</h4>
                <div class="table-responsive">
                    <table class="table table-bordered text-center">
                        <thead class="table-secondary">
                            <tr>
                                <th>رسید نمبر</th>
                                <th>طالبہ کا نام</th>
                                <th>کلاس</th>
                                <th>رقم</th>
                                <th>بابت مہینہ</th>
                                <th>تاریخِ ادائیگی</th>
                                <th>ایکشن</th>
                            </tr>
                        </thead>
                        <tbody id="feesTableBody"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <!-- جاوا اسکرپٹ لاجک لاگو کرنا -->
    <script>
        // داخلہ جمع کروانا
        async function submitAdmission(e) {
            e.preventDefault();
            const data = {
                fullName: document.getElementById('fullName').value,
                fatherName: document.getElementById('fatherName').value,
                dob: document.getElementById('dob').value,
                bForm: document.getElementById('bForm').value,
                admissionClass: document.getElementById('admissionClass').value,
                guardianPhone: document.getElementById('guardianPhone').value,
                address: document.getElementById('address').value
            };

            const res = await fetch('/api/students', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            alert(result.message);
            if(result.success) document.getElementById('admissionForm').reset();
        }

        // طالبات لوڈ کرنا
        async function loadStudents() {
            const res = await fetch('/api/students');
            const data = await res.json();
            const tbody = document.getElementById('studentsTableBody');
            tbody.innerHTML = '';
            
            if(data.students) {
                data.students.forEach(s => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${s.fullName}</td>
                            <td>${s.fatherName}</td>
                            <td>${s.admissionClass}</td>
                            <td>${s.bForm}</td>
                            <td>${s.guardianPhone}</td>
                            <td>${s.admissionDate}</td>
                            <td><button class="btn btn-danger btn-sm" onclick="deleteStudent(${s.id})">حذف</button></td>
                        </tr>`;
                });
            }
        }

        // طالبہ کا ریکارڈ حذف کرنا
        async function deleteStudent(id) {
            if(confirm('کیا آپ واقعی یہ ریکارڈ حذف کرنا چاہتے ہیں؟')) {
                const res = await fetch(`/api/students/${id}`, { method: 'DELETE' });
                const result = await res.json();
                alert(result.message);
                loadStudents();
            }
        }

        // فیس کا پیج ڈیٹا لوڈ کرنا
        async function loadFeesPage() {
            // طالبات ڈراپ ڈاؤن لوڈ کریں
            const resStu = await fetch('/api/students');
            const dataStu = await resStu.json();
            const select = document.getElementById('feeStudentSelect');
            select.innerHTML = '<option value="">انتخاب کریں...</option>';
            if(dataStu.students) {
                dataStu.students.forEach(s => {
                    select.innerHTML += `<option value="${s.id}">${s.fullName} بنٹ ${s.fatherName} (${s.admissionClass})</option>`;
                });
            }

            // فیس ہسٹری لوڈ کریں
            const resFee = await fetch('/api/fees');
            const dataFee = await resFee.json();
            const tbody = document.getElementById('feesTableBody');
            tbody.innerHTML = '';
            if(dataFee.fees) {
                dataFee.fees.forEach(f => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${f.receiptNo}</td>
                            <td>${f.studentName}</td>
                            <td>${f.admissionClass}</td>
                            <td>${f.amount}</td>
                            <td>${f.month} ${f.year}</td>
                            <td>${f.paymentDate}</td>
                            <td><button class="btn btn-danger btn-sm" onclick="deleteFee(${f.id})">حذف</button></td>
                        </tr>`;
                });
            }
        }

        // فیس جمع کرنا
        async function submitFee(e) {
            e.preventDefault();
            const data = {
                studentId: document.getElementById('feeStudentSelect').value,
                amount: document.getElementById('feeAmount').value,
                month: document.getElementById('feeMonth').value,
                year: document.getElementById('feeYear').value
            };

            const res = await fetch('/api/fees', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            alert(result.message);
            if(result.success) {
                document.getElementById('feeForm').reset();
                loadFeesPage();
            }
        }

        // فیس ہسٹری حذف کرنا
        async function deleteFee(id) {
            if(confirm('کیا آپ فیس ریکارڈ حذف کرنا چاہتے ہیں؟')) {
                const res = await fetch(`/api/fees/${id}`, { method: 'DELETE' });
                const result = await res.json();
                alert(result.message);
                loadFeesPage();
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
